[versions]
agp = "8.9.1"
kotlin = "2.1.0"
compose = "2025.02.00"
room = "2.7.2"

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-kapt = { id = "org.jetbrains.kotlin.kapt", version.ref = "kotlin" }

[libraries]
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-tooling = { module = "androidx.compose.ui:ui-tooling" }
activity-compose = { module = "androidx.activity:activity-compose", version = "1.10.1" }
lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version = "2.8.7" }
lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version = "2.8.7" }
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
datastore = { module = "androidx.datastore:datastore-preferences", version = "1.1.3" }
coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version = "1.9.0" }
beanshell = { module = "io.github.beanshell:bsh", version = "2.1.1" }
xposed = { module = "de.robv.android.xposed:api", version = "82" }
junit = { module = "junit:junit", version = "4.13.2" }
androidx-test-runner = { module = "androidx.test:runner", version = "1.6.2" }
androidx-test-junit = { module = "androidx.test.ext:junit", version = "1.2.1" }
dexkit = { module = "org.luckypray:dexkit", version = "2.0.7" }
jadx-core = { module = "io.github.skylot:jadx-core", version = "1.5.1" }
jadx-dex = { module = "io.github.skylot:jadx-dex-input", version = "1.5.1" }

okhttp = { module = "com.squareup.okhttp3:okhttp", version = "4.12.0" }
mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version = "4.12.0" }
libxposed = { module = "io.github.libxposed:api", version = "101.0.1" }
libxposed-service = { module = "io.github.libxposed:service", version = "101.0.0" }
smali-dexlib = { module = "com.android.tools.smali:smali-dexlib2", version = "3.0.8" }
smali-baksmali = { module = "com.android.tools.smali:smali-baksmali", version = "3.0.8" }
json = { module = "org.json:json", version = "20240303" }
