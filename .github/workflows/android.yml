name: Android
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-35' 'platforms;android-36' 'build-tools;35.0.0' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:assembleDebug :demo-target:assembleDebug :app:assembleDebugAndroidTest :hook-runtime:testDebugUnitTest :demo-target:testDebugUnitTest :app:testDebugUnitTest --console=plain --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process
      - run: python3 scripts/verify-skill-migration.py
      - uses: actions/upload-artifact@v4
        with:
          name: easylsp-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            demo-target/build/outputs/apk/debug/*.apk
            standalone-template/build/outputs/apk/debug/*.apk
          retention-days: 7
